name: messenger-local-cluster

# Both instances use the same image, build context, and runtime settings.
x-backend: &backend
  image: messenger-local-backend:latest
  build:
    context: ./backend/demo
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 40s
  environment:
    DB_URL: jdbc:postgresql://host.docker.internal:5432/messenger
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the root .env file}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    SERVER_PORT: "8080"
    SERVER_ADDRESS: 0.0.0.0
    # Allow both the Docker frontend and the host's Vite development server.
    MAIL_PRODUCT_NAME: ${MAIL_PRODUCT_NAME:-Let's Talk}
    BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
    SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-5m}
    MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-1}
    MAIL_HOST: ${MAIL_HOST:-localhost}
    MAIL_PORT: ${MAIL_PORT:-1025}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
    MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    MAIL_FROM: ${MAIL_FROM:-no-reply@lets-talk.local}
    FILE_STORAGE_PATH: /var/lib/messenger/files
    FILE_MAX_SIZE: ${FILE_MAX_SIZE:-5MB}
    FILE_VIDEO_MAX_SIZE: ${FILE_VIDEO_MAX_SIZE:-200MB}
    FILE_MAX_REQUEST_SIZE: ${FILE_MAX_REQUEST_SIZE:-201MB}
    FILE_DAILY_QUOTA: ${FILE_DAILY_QUOTA:-1GB}
    FILE_RETENTION: ${FILE_RETENTION:-60d}
    TRUSTED_PROXY_PATTERN: ${TRUSTED_PROXY_PATTERN:-172[.](1[6-9]|2[0-9]|3[01])[.]\d+[.]\d+}
    SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
    FRONTEND_ORIGIN: http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173
    PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
    PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
    PUSH_SUBJECT: ${PUSH_SUBJECT:-}
    # First administrator on a fresh database; existing credentials are preserved.
    BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
    BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    REDIS_URL: redis://messenger-redis:6379
  # Both backends share one file volume so either can serve any upload.
  volumes:
    - file-data:/var/lib/messenger/files
  depends_on:
    messenger-redis:
      condition: service_healthy
  healthcheck:
    # curl is installed explicitly by the existing backend Dockerfile.
    test:
      [
        "CMD",
        "curl",
        "--fail",
        "--silent",
        "--show-error",
        "--max-time",
        "4",
        "http://localhost:8080/actuator/health",
      ]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s
  networks:
    - messenger-network

services:
  messenger-frontend:
    environment:
      BACKEND_SERVERS: "server messenger-backend-1:8080; server messenger-backend-2:8080;"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      messenger-backend-1:
        condition: service_healthy
      messenger-backend-2:
        condition: service_healthy
    healthcheck:
      # BusyBox wget is provided by the existing Alpine runtime image.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - messenger-network

  messenger-backend-1:
    <<: *backend
    ports:
      - "127.0.0.1:8080:8080"

  messenger-backend-2:
    <<: *backend
    ports:
      - "127.0.0.1:8081:8080"

  messenger-redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Host debugging only; application connections use the bridge network.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - messenger-network

networks:
  messenger-network:
    driver: bridge

volumes:
  redis-data:
  file-data:
