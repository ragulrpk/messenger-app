# Let's Talk. Rendered by the container entrypoint; only named environment
# placeholders are substituted. Nginx request variables remain intact.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream lets_talk_backend {
    ${BACKEND_SERVERS}
    keepalive 16;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;
    client_body_timeout 120s;
    client_header_timeout 10s;
    send_timeout 120s;
    keepalive_timeout 65s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # This is the application edge: replace client-supplied forwarding headers.
    # Behind an ingress, configure trusted real-IP handling there before enabling it here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 120s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location = /api/v1/chat/events {
        proxy_pass http://lets_talk_backend;
        # Repeat headers: defining any proxy_set_header disables parent inheritance.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
    location ~ ^/api/v1/chat/conversations/[^/]+/files$ {
        client_max_body_size ${UPLOAD_MAX_BODY_SIZE};
        proxy_request_buffering off;
        # Do not retry a partially transmitted upload on another backend.
        proxy_next_upstream off;
        proxy_read_timeout 120s;
        proxy_pass http://lets_talk_backend;
    }
    location /api/ {
        proxy_pass http://lets_talk_backend;
    }
    location = /actuator/health {
        proxy_read_timeout 10s;
        proxy_pass http://lets_talk_backend;
    }
    location ^~ /actuator/health/ {
        proxy_read_timeout 10s;
        proxy_pass http://lets_talk_backend;
    }
    location /actuator/ { return 404; }
    location ~ /\. { deny all; }

    # No location-level add_header: keep all server security headers inherited.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /notifications-sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /lets-talk.svg {
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
