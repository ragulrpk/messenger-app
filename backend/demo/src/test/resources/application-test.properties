spring.datasource.url=jdbc:h2:mem:messenger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
server.servlet.session.cookie.secure=false
app.cors.allowed-origins=http://localhost:5173
# 2026-09-23: Unit/local HTTP tests use servlet sessions; production IT uses a different profile.
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
spring.data.redis.url=redis://127.0.0.1:6379
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db
logging.structured.format.console=
