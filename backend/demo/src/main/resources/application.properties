spring.application.name=messenger
server.port=${SERVER_PORT:8080}
# Only explicitly configured proxy peers may influence the client address.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_PATTERN:^$}
app.security.trusted-request-id-proxies=${TRUSTED_PROXY_PATTERN:^$}
server.max-http-request-header-size=${MAX_REQUEST_HEADER_SIZE:16KB}
server.tomcat.max-http-form-post-size=${MAX_REQUEST_BODY_SIZE:64KB}
server.tomcat.max-swallow-size=${MAX_REQUEST_BODY_SIZE:64KB}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:5s}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:120000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:10000}
spring.transaction.default-timeout=${DB_TRANSACTION_TIMEOUT:15s}
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL}}
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD}}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Redis HTTP sessions are enabled by the Boot session starter; local/test explicitly exclude it.
spring.session.redis.namespace=messenger:session
# 2026-09-23: Principal indexes are required by concurrent-session checks and WebSocket revocation.
spring.session.redis.repository-type=indexed
spring.session.redis.flush-mode=on-save
spring.data.redis.url=${REDIS_URL}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
logging.structured.format.console=${LOG_FORMAT:logstash}
app.cors.allowed-origins=${FRONTEND_ORIGIN}
app.security.login-rate-limit.attempts=${LOGIN_RATE_LIMIT:20}
app.security.login-rate-limit.window=${LOGIN_RATE_WINDOW:60s}
app.security.max-sessions-per-user=${MAX_SESSIONS_PER_USER:5}
