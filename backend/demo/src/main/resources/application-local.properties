# Explicit development profile only: --spring.profiles.active=local
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/messenger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://127.0.0.1:5432/messenger}}
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME:postgres}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD:123}}
server.servlet.session.cookie.secure=false
server.address=127.0.0.1
# The local Vite proxy connects to the backend over IPv4 loopback.
server.tomcat.remoteip.internal-proxies=127[.]0[.]0[.]1
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app.bootstrap.username=${BOOTSTRAP_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
# 2026-09-23: Boot 4 uses store-specific auto-configuration; keep local servlet sessions Redis-free.
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
spring.data.redis.url=redis://127.0.0.1:6379
spring.data.redis.repositories.enabled=false
# Expose the same Actuator probes during local development. Readiness verifies
# the Windows PostgreSQL connection; Redis is intentionally not used locally.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db
logging.structured.format.console=
