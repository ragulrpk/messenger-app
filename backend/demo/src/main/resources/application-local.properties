# ============================================================
# LOCAL DEVELOPMENT PROFILE
# Activate with: --spring.profiles.active=local
# ============================================================

# ============================================================
# POSTGRESQL - LOCAL DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/messenger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# ============================================================
# FLYWAY - LOCAL DATABASE MIGRATIONS
# ============================================================

spring.flyway.url=${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://127.0.0.1:5432/messenger}}
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME:postgres}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD:123}}

# ============================================================
# HTTP SESSION COOKIE - LOCAL DEVELOPMENT
# ============================================================

# Production application.properties uses secure=true.
# Local development uses HTTP (localhost), so Secure must be false.
server.servlet.session.cookie.secure=false

# ============================================================
# LOCAL SERVER
# ============================================================

# Bind Spring Boot to the local machine only.
server.address=127.0.0.1

# The local Vite proxy connects to the backend over IPv4 loopback.
server.tomcat.remoteip.internal-proxies=127[.]0[.]0[.]1

# ============================================================
# CORS - LOCAL FRONTEND
# ============================================================

app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}

# ============================================================
# LOCAL BOOTSTRAP USER
# ============================================================

app.bootstrap.username=${BOOTSTRAP_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}

# ============================================================
# REDIS - LOCAL DEVELOPMENT
# ============================================================

# DO NOT exclude Redis Session auto-configuration.
# We now want Spring Session to store HTTP sessions in Redis.
#
# Previously this was enabled to intentionally keep local
# servlet sessions out of Redis.
#
# spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration

# Redis is currently running in Docker with:
#
# docker run -d --name messenger-redis -p 6379:6379 redis:8-alpine
#
# Because port 6379 is published to Windows, the locally running
# Spring Boot application can reach Redis through localhost:6379.

#spring.data.redis.host=localhost
spring.data.redis.host=messenger-redis
spring.data.redis.port=6379

# NOTE:
# Not required for the current Spring Boot 4 setup because the
# Redis session starter provides the Redis HTTP-session
# auto-configuration.
#
# Kept here for reference instead of deleting it.
#
# spring.session.store-type=redis

# Alternative Redis configuration using a URL.
#
# Do not configure both URL and host/port unnecessarily.
# We are currently using host + port above.
#
spring.data.redis.url=redis://127.0.0.1:6379

# We are using Redis for Spring Session, not Spring Data Redis
# repositories such as RedisRepository interfaces.
# Therefore Redis repository scanning remains disabled.

spring.data.redis.repositories.enabled=false

# ============================================================
# ACTUATOR / HEALTH CHECKS
# ============================================================

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.endpoint.health.group.liveness.include=livenessState

# Redis is now part of our local application infrastructure.
# Previously this was false because Redis was intentionally
# not used locally.
#
# management.health.redis.enabled=false

# Previously local readiness checked only:
#
# readinessState + PostgreSQL
#
# management.endpoint.health.group.readiness.include=readinessState,db
#
# Now that Redis is required for HTTP sessions locally,
# readiness should also verify Redis.

management.endpoint.health.group.readiness.include=readinessState,db,redis

# ============================================================
# LOCAL LOGGING
# ============================================================

# Overrides the structured/logstash console format configured
# in application.properties for easier local development.

logging.structured.format.console=

# ============================================================
# FILE STORAGE - LOCAL DEVELOPMENT
# ============================================================

# Uploaded files are kept next to the project instead of /var/lib.
app.files.root=${FILE_STORAGE_PATH:./data/files}