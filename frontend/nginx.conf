# ============================================================
# BACKEND LOAD BALANCER
# ============================================================
#
# Both Spring Boot containers are registered here.
#
# Docker DNS resolves:
#
#   messenger-backend-1 -> Backend instance 1
#   messenger-backend-2 -> Backend instance 2
#
# Nginx uses round-robin load balancing by default.
#
# Example:
#
#   Request 1 -> Backend 1
#   Request 2 -> Backend 2
#   Request 3 -> Backend 1
#   Request 4 -> Backend 2
#
# ============================================================

upstream messenger_backend {

    server messenger-backend-1:8080;

    server messenger-backend-2:8080;
}


# ============================================================
# FRONTEND SERVER
# ============================================================

server {

    listen 8080;

    server_name _;

    server_tokens off;


    # ========================================================
    # REACT BUILD
    # ========================================================

    root /usr/share/nginx/html;

    index index.html;


    # ========================================================
    # REQUEST SIZE
    # ========================================================

    client_max_body_size 64k;
	
	# Temporary debugging header.
    # Shows which backend handled the request.
    #add_header X-Backend-Server $upstream_addr always;


    # ========================================================
    # SECURITY HEADERS
    # ========================================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "DENY" always;

    add_header Referrer-Policy "no-referrer" always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
        always;


    # ========================================================
    # NGINX HEALTH CHECK
    # ========================================================

    location = /healthz {

        access_log off;

        return 200 "ok\n";
    }


    # ========================================================
    # WEBSOCKET
    # ========================================================
    #
    # Browser:
    #
    #   ws://localhost/api/v1/chat/events
    #
    #                 |
    #                 v
    #
    #              Nginx
    #
    #             /     \
    #
    #      Backend 1   Backend 2
    #
    #
    # Once a WebSocket connection has been assigned to one
    # backend, that WebSocket remains connected to that
    # backend.
    #
    # ========================================================

    location = /api/v1/chat/events {

        proxy_pass http://messenger_backend;


        # WebSocket requires HTTP/1.1

        proxy_http_version 1.1;


        # Upgrade normal HTTP connection to WebSocket

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";


        # Forward original request information

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Request-ID $request_id;


        # WebSocket data should not be buffered

        proxy_buffering off;


        # Your application sends heartbeat traffic,
        # so keep the connection alive long enough.

        proxy_read_timeout 65s;

        proxy_send_timeout 65s;
    }


    # ========================================================
    # SPRING BOOT REST API
    # ========================================================
    #
    # Example:
    #
    #   /api/v1/users/login
    #   /api/v1/users/csrf
    #   /api/v1/chat/conversations
    #
    # These requests will be distributed between Backend 1
    # and Backend 2.
    #
    # Spring Session + Redis allows either backend to read
    # the same authenticated session.
    #
    # ========================================================

    # ========================================================
    # FILE UPLOADS
    # ========================================================
    #
    # Only the upload endpoint accepts large bodies; every other
    # request keeps the 64k limit above. Bodies are streamed to
    # Spring Boot, which enforces the 50 MB file limit itself.
    #
    # ========================================================

    location ~ ^/api/v1/chat/conversations/[^/]+/files$ {

        client_max_body_size 51m;

        proxy_request_buffering off;

        proxy_pass http://messenger_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;

        proxy_send_timeout 120s;

        proxy_read_timeout 120s;
    }

    location /api/ {

        proxy_pass http://messenger_backend;


        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Request-ID $request_id;


        proxy_connect_timeout 5s;

        proxy_read_timeout 65s;
    }


    # ========================================================
    # SPRING BOOT ACTUATOR HEALTH
    # ========================================================

    location ^~ /actuator/health {

        proxy_pass http://messenger_backend;


        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Request-ID $request_id;


        proxy_connect_timeout 5s;

        proxy_read_timeout 10s;
    }


    # ========================================================
    # STATIC ASSETS
    # ========================================================

    location /assets/ {

        try_files $uri =404;


        # Vite-generated assets normally contain hashes,
        # therefore they can be cached for a long time.

        expires 1y;

        add_header Cache-Control "public, immutable";


        # Security headers must be repeated because Nginx
        # add_header inheritance changes when add_header is
        # declared inside a location.

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "DENY" always;

        add_header Referrer-Policy "no-referrer" always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
            always;
    }


    # ========================================================
    # REACT SPA
    # ========================================================
    #
    # If a physical file doesn't exist, return index.html.
    #
    # Example:
    #
    #   /
    #   /chat
    #   /settings
    #
    # React Router can then handle the route.
    #
    # ========================================================

    location / {

        try_files $uri $uri/ /index.html;


        add_header Cache-Control "no-cache";


        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "DENY" always;

        add_header Referrer-Policy "no-referrer" always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()"
            always;

        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
            always;
    }
}