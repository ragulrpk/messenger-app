name: messenger-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/messenger
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      MAIL_PRODUCT_NAME: ${MAIL_PRODUCT_NAME:-Let's Talk}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-5m}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-1}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@lets-talk.local}
      TRUSTED_PROXY_PATTERN: ${TRUSTED_PROXY_PATTERN:-172[.](1[6-9]|2[0-9]|3[01])[.]\d+[.]\d+}
      FRONTEND_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/demo:/workspace
      - maven-dev-cache:/root/.m2
      - backend-dev-target:/workspace/target

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
      VITE_AUTH_LOGIN_URL: /api/v1/users/login
      VITE_CHAT_API_URL: /api/v1/chat
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/workspace
      - frontend-dev-node-modules:/workspace/node_modules
      - npm-dev-cache:/root/.npm

volumes:
  postgres-dev-data:
  maven-dev-cache:
  backend-dev-target:
  frontend-dev-node-modules:
  npm-dev-cache:
