name: Let's Talk CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw --batch-mode verify
      - run: ./mvnw --batch-mode -Pintegration-tests verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/demo/target/surefire-reports/
            backend/demo/target/failsafe-reports/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: lets-talk-ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      REDIS_PASSWORD: ci-only-password
      PUBLIC_ORIGIN: http://localhost:8080
      PUBLIC_SCHEME: http
      PUBLIC_PORT: "8080"
      BOOTSTRAP_USERNAME: ci-admin
      BOOTSTRAP_PASSWORD: ci-only-admin-password
      BOOTSTRAP_EMAIL: ci-admin@example.test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.production.yml config
      - run: docker compose -p lets-talk-ci -f compose.production.yml build --pull
      - name: Start production stack
        run: docker compose -f compose.production.yml up --detach --wait --wait-timeout 240
      - name: Validate Nginx configuration
        run: docker compose -f compose.production.yml exec -T frontend nginx -t
      - name: Check Let’s Talk through Nginx
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/healthz | grep -q ok
          curl --fail --silent http://localhost:8080/ | grep -q "Let's Talk"
          curl --fail --silent http://localhost:8080/lets-talk.svg | grep -q '<svg'
          curl --fail --silent http://localhost:8080/actuator/health/readiness | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"'
          curl --fail --silent http://localhost:8080/api/v1/users/csrf | python3 -c 'import json,sys; assert json.load(sys.stdin)["token"]'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/v1/users/me)" = 401
      - name: Production stack logs
        if: failure()
        run: docker compose -f compose.production.yml logs --no-color --tail 200
      - name: Stop CI stack
        if: always()
        run: docker compose -f compose.production.yml down --volumes --remove-orphans
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: lets-talk-ci-frontend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: lets-talk-ci-backend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish ${{ matrix.app }} to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Choose Let's Talk image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${OWNER,,}/lets-talk-${APP}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app == 'backend' && './backend/demo' || './frontend' }}
          push: true
          pull: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
