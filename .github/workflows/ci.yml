name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw --batch-mode verify
      - run: ./mvnw --batch-mode -Pintegration-tests verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.production.yml config
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-password
          PUBLIC_ORIGIN: https://messenger.example.test
      - run: docker compose -f compose.production.yml build
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-password
          PUBLIC_ORIGIN: https://messenger.example.test
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
