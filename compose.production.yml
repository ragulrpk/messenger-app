services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: ./backend/demo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-messenger}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATION_DB_URL: ${MIGRATION_DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-messenger}}
      MIGRATION_DB_USERNAME: ${MIGRATION_DB_USERNAME:-${POSTGRES_USER}}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
      TRUSTED_PROXY_PATTERN: 172[.]\d+[.]\d+[.]\d+
      LOG_FORMAT: logstash
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-60s}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      MAX_REQUEST_HEADER_SIZE: ${MAX_REQUEST_HEADER_SIZE:-16KB}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-64KB}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      TOMCAT_MIN_SPARE_THREADS: ${TOMCAT_MIN_SPARE_THREADS:-10}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-8192}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-10000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-600000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-1800000}
      DB_KEEPALIVE_TIME_MS: ${DB_KEEPALIVE_TIME_MS:-120000}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
